spring.application.name=ssclassroom

# to instruct spring boot to import .env file directly at startup
spring.config.import=optional:file:.env[.properties]

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/ssclassroomdb
spring.datasource.username=postgres
spring.datasource.password=admin2255
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate Confiugration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# S3 Configuration
spring.cloud.aws.region.static=ap-southeast-1
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}

# LocalStack endpoint configuration
aws.s3.endpoint=http://localhost:4566

# Custom property for your bucket name
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
