# environment isolation.
# if this was set in application.yml or application.properties,
# in here, every environment including production, this would look for LocalStack

# so if we create a local profile (application-local.yml this file)
# this will only load when app runs with "local" profile

spring:
  flyway:
    # db/migration-local holds seed data (test users/cohorts) that must only exist locally
    locations: classpath:db/migration,classpath:db/migration-local

aws:
  s3:
    endpoint: http://localhost:4566
    region: ap-southeast-1
    access-key: test
    secret-key: test
    buckets:
      pdf: pdf-submissions-bucket
      txt: txt-submissions-bucket
      zip: zip-submissions-bucket
      docx: docx-submissions-bucket
